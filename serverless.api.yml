service: site-asso-api
frameworkVersion: '4'

org: wolfcorp
app: site-asso

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-west-3
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 12
  # httpApi:
  #   throttling:
  #     burstLimit: 50 #pics max
  #     rateLimit: 25 #req/s
  environment:
    NODE_OPTIONS: '--enable-source-maps'
    RUNTIME: 'lambda'
    # Récupère la table depuis la stack infra (via Outputs)
    USER_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbUserTable}
    AUTH_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbAuthTableName}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:ConditionCheckItem
          Resource:
            - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}
            - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}/index/*

plugins:
  - ./backend/node_modules/serverless-esbuild
  - ./backend/node_modules/serverless-iam-roles-per-function

custom:
  esbuild:
    bundle: true
    platform: node
    target: node22
    format: esm            # <-- clé : passe en ESM
    sourcemap: true
    minify: false
    external: []           # bundle tout (évite les “missing module”)
    mainFields:
      - module
      - main
    banner:
      js: "import { createRequire } from 'module'; global.require = createRequire(import.meta.url);"

functions:
  api:
    handler: backend/lambda/lambda.handler
    events:
      - httpApi: 
          method: '*'
          path: /api
      - httpApi:
          method: '*'
          path: /api/{proxy+}

  hello:
    handler: backend/lambda/hello.handler
    events:
      - httpApi: 
          method: GET
          path: /hello

  addUser:
    handler: backend/lambda/addUserLambda.handler
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}
          - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}/index/*
    events:
      - httpApi: 
          method: PUT
          path: /addUser

  getUser:
    handler: backend/lambda/getUserLambda.handler
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}
          - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}/index/*
    events:
      - httpApi: 
          method: GET
          path: /getUser

  registerUser:
    handler: backend/lambda/registerUserLambda.handler
    # reservedConcurrency: 5
    memorySize: 1024
    architecture: arm64
    environment:
      AUTH_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbAuthTableName}
      RATE_LIMIT_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTable}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:TransactWriteItems
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbAuthTableArn}
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTableArn}
    events:
      - httpApi: 
          method: PUT
          path: /registerUser

  updateAuthUser:
    handler: backend/lambda/updateAuthUserLambda.handler
    memorySize: 1024
    architecture: arm64
    environment:
      AUTH_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbAuthTableName}
      RATE_LIMIT_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTable}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:PutItem
          - dynamodb:GetItem
          - dynamodb:TransactWriteItems
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbAuthTableArn}
          - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}

      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTableArn}
    events:
      - httpApi: 
          method: PATCH
          path: /updateUser

  removeAuthUser:
    handler: backend/lambda/removeAuthUserLambda.handler
    memorySize: 1024
    architecture: arm64
    environment:
      AUTH_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbAuthTableName}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:DeleteItem
          - dynamodb:GetItem
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbAuthTableArn}
    events:
      - httpApi:
          method: DELETE
          path: /removeAuthUser
          
  onAuthUserStream: #Ajout de nouveau user dans la table générale des users
    handler: backend/lambda/onAuthStreamLambda.handler
    architecture: arm64           # ARM64 conseillé
    memorySize: 1024              # 1024–1536 Mo pour marge CPU
    timeout: 30
    environment:
      USERS_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbUserTable}
    events:
      - stream:
          type: dynamodb
          arn: ${cf:site-asso-infra-${sls:stage}.DdbAuthStreamArn}  # <- Output ARN du stream
          batchSize: 10
          startingPosition: LATEST
          maximumRetryAttempts: 3
          bisectBatchOnFunctionError: true
          destinations:
            onFailure:
              type: sqs
              arn:
                Fn::GetAtt: [ AuthStreamDLQ, Arn ]
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:ConditionCheckItem
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}

      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [ AuthStreamDLQ, Arn ]

  # onUpdateAuthUserStream: #Ajout de nouveau user dans la table générale des users
  #   handler: backend/lambda/onUpdateAuthStreamLambda.handler
  #   architecture: arm64           # ARM64 conseillé
  #   memorySize: 1024              # 1024–1536 Mo pour marge CPU
  #   timeout: 30
  #   environment:
  #     USERS_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbUserTable}
  #   events:
  #     - stream:
  #         type: dynamodb
  #         arn: ${cf:site-asso-infra-${sls:stage}.DdbAuthStreamArn}  # <- Output ARN du stream
  #         batchSize: 10
  #         startingPosition: LATEST
  #         maximumRetryAttempts: 3
  #         bisectBatchOnFunctionError: true
  #         destinations:
  #           onFailure:
  #             type: sqs
  #             arn:
  #               Fn::GetAtt: [ AuthStreamDLQ, Arn ]
  #   iamRoleStatements:
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:UpdateItem
  #         - dynamodb:DeleteItem
  #         - dynamodb:PutItem
  #         - dynamodb:TransactWriteItems
  #         - dynamodb:ConditionCheckItem
  #       Resource:
  #         - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}

  #     - Effect: Allow
  #       Action:
  #         - sqs:SendMessage
  #         - sqs:GetQueueAttributes
  #       Resource:
  #         - Fn::GetAtt: [ AuthStreamDLQ, Arn ]

  onRemoveAuthUserStream: #Ajout de nouveau user dans la table générale des users
    handler: backend/lambda/onRemoveAuthStreamLambda.handler
    architecture: arm64           # ARM64 conseillé
    memorySize: 1024              # 1024–1536 Mo pour marge CPU
    timeout: 30
    environment:
      USERS_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbUserTable}
    events:
      - stream:
          type: dynamodb
          arn: ${cf:site-asso-infra-${sls:stage}.DdbAuthStreamArn}  # <- Output ARN du stream
          batchSize: 10
          startingPosition: LATEST
          maximumRetryAttempts: 3
          bisectBatchOnFunctionError: true
          destinations:
            onFailure:
              type: sqs
              arn:
                Fn::GetAtt: [ AuthStreamDLQ, Arn ]
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:TransactWriteItems
          - dynamodb:ConditionCheckItem
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}

      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [ AuthStreamDLQ, Arn ]

resources:
  Resources:
    AuthStreamDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-authstream-dlq

package:
  patterns:
    - backend/**
    - backend/lambda/**
    - '!**/.git/**'
    - '!**/.vscode/**'
    - '!**/*.map'

