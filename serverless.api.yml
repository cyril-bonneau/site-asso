  # getUser:
  #   handler: backend/lambda/getUserLambda.handler
  #   iamRoleStatements:
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:GetItem
  #       Resource:
  #         - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}
  #         - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}/index/*
  #   events:
  #     - httpApi: 
  #         method: GET
  #         path: /getUser

  registerUser:
    handler: backend/lambda/registerUserLambda.handler
    # reservedConcurrency: 5
    memorySize: 1024
    architecture: arm64
    # provisionedConcurrency: 1
    environment:
      AUTH_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbAuthTableName}
      RATE_LIMIT_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTable}
      REGISTER_EVENT_BUS: ${cf:site-asso-infra-${sls:stage}.RegisterEventBusName}
      JWT_ACCESS_PUB_PEM: ${ssm:/site-asso/${sls:stage}/cfg/jwtAccessPub}
      KMS_JWT_KEY_ID: alias/site-asso-auth-${sls:stage}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:TransactWriteItems
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbAuthTableArn}

      - Effect: Allow
        Action:
          - kms:Sign
        Resource: arn:aws:kms:${self:provider.region}:011664843444:alias/site-asso-auth-${sls:stage}

      - Effect: Allow
        Action:
          - events:PutEvents
        Resource: ${cf:site-asso-infra-${sls:stage}.RegisterEventBusArn}

      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTableArn}
    events:
      - httpApi: 
          method: PUT
          path: /registerUser

  loginUser:
    handler: backend/lambda/logInAuthUserLambda.handler
    memorySize: 1024
    architecture: arm64
    # provisionedConcurrency: 1
    environment:
      AUTH_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbAuthTableName}
      RATE_LIMIT_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTable}
      JWT_ACCESS_PUB_PEM: ${ssm:/site-asso/${sls:stage}/cfg/jwtAccessPub}
      KMS_JWT_KEY_ID:
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource: 
          - ${cf:site-asso-infra-${sls:stage}.DdbAuthTableArn}
          - ${cf:site-asso-infra-${sls:stage}.DdbAuthTableArn}/index/*

      - Effect: Allow
        Action:
          - kms:Sign
        Resource: arn:aws:kms:${self:provider.region}:011664843444:alias/site-asso-auth-${sls:stage}
      
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTableArn}
    events:
      - httpApi:
          method: GET
          path: /login

  updateAuthUser:
    handler: backend/lambda/updateAuthUserLambda.handler
    memorySize: 1024
    architecture: arm64
    environment:
      AUTH_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbAuthTableName}
      RATE_LIMIT_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTable}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:PutItem
          - dynamodb:GetItem
          - dynamodb:TransactWriteItems
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbAuthTableArn}
          - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}

      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTableArn}
    events:
      - httpApi: 
          method: PATCH
          path: /updateUser

  updateAuthUserPassword:
    handler: backend/lambda/updateAuthUserPasswordLambda.handler
    memorySize: 1024
    architecture: arm64
    environment:
      AUTH_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbAuthTableName}
      RATE_LIMIT_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTable}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:UpdateItem
          - dynamodb:GetItem
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbAuthTableArn}
          
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: ${cf:site-asso-infra-${sls:stage}.DdbRateLimitTableArn}
    events:
      - httpApi: 
          method: PATCH
          path: /updatePassword

  removeAuthUser:
    handler: backend/lambda/removeAuthUserLambda.handler
    memorySize: 1024
    architecture: arm64
    environment:
      AUTH_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbAuthTableName}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:DeleteItem
          - dynamodb:GetItem
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbAuthTableArn}
    events:
      - httpApi:
          method: DELETE
          path: /removeAuthUser
          
  onRegisterAuth: #Ajout de nouveau user dans la table générale des users
    handler: backend/lambda/onRegisterAuthLambda.handler
    memorySize: 1024              # 1024–1536 Mo pour marge CPU
    architecture: arm64           # ARM64 conseillé
    timeout: 30
    environment:
      USER_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbUserTable}
    events:
      - eventBridge:
          eventBus: ${cf:site-asso-infra-${sls:stage}.RegisterEventBusArn}
          pattern:
            source:
              - site-asso.auth.register
            detail-type:
              - UserRegistered
          deadLetterQueueArn:
            Fn::GetAtt: 
              - RegisterEventDLQ
              - Arn
          retryPolicy:
            maximumRetryAttempts: 3
            maximumEventAgeInSeconds: 3600
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:TransactWriteItems
          - dynamodb:ConditionCheckItem
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}

  # onUpdateAuthUserStream: #Ajout de nouveau user dans la table générale des users
  #   handler: backend/lambda/onUpdateAuthStreamLambda.handler
  #   architecture: arm64           # ARM64 conseillé
  #   memorySize: 1024              # 1024–1536 Mo pour marge CPU
  #   timeout: 30
  #   environment:
  #     USERS_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbUserTable}
  #   events:
  #     - stream:
  #         type: dynamodb
  #         arn: ${cf:site-asso-infra-${sls:stage}.DdbAuthStreamArn}  # <- Output ARN du stream
  #         batchSize: 10
  #         startingPosition: LATEST
  #         maximumRetryAttempts: 3
  #         bisectBatchOnFunctionError: true
  #         destinations:
  #           onFailure:
  #             type: sqs
  #             arn:
  #               Fn::GetAtt: [ AuthStreamDLQ, Arn ]
  #   iamRoleStatements:
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:UpdateItem
  #         - dynamodb:DeleteItem
  #         - dynamodb:PutItem
  #         - dynamodb:TransactWriteItems
  #         - dynamodb:ConditionCheckItem
  #       Resource:
  #         - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}

  #     - Effect: Allow
  #       Action:
  #         - sqs:SendMessage
  #         - sqs:GetQueueAttributes
  #       Resource:
  #         - Fn::GetAtt: [ AuthStreamDLQ, Arn ]

  onRemoveAuthUserStream: #suppression de user dans la table générale des users
    handler: backend/lambda/onRemoveAuthStreamLambda.handler
    architecture: arm64           # ARM64 conseillé
    memorySize: 1024              # 1024–1536 Mo pour marge CPU
    timeout: 30
    environment:
      USER_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbUserTable}
    events:
      - stream:
          type: dynamodb
          arn: ${cf:site-asso-infra-${sls:stage}.DdbAuthStreamArn}  # <- Output ARN du stream
          batchSize: 10
          startingPosition: LATEST
          maximumRetryAttempts: 3
          bisectBatchOnFunctionError: true
          destinations:
            onFailure:
              type: sqs
              arn:
                Fn::GetAtt: [ AuthStreamDLQ, Arn ]
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:DeleteItem
          - dynamodb:TransactWriteItems
          - dynamodb:ConditionCheckItem
        Resource:
          - ${cf:site-asso-infra-${sls:stage}.DdbUserTableArn}

      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [ AuthStreamDLQ, Arn ]

resources:
  Resources:
    AuthStreamDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-authstream-dlq

    RegisterEventDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-register-event-dlq

package:
  patterns:
    - '!backend/tests/**'
    - 'package.json'
    - 'backend/package.json'

