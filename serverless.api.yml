service: site-asso-api
frameworkVersion: '4'

org: wolfcorp
app: site-asso

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-west-3
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 12
  # httpApi:
  #   throttling:
  #     burstLimit: 50 #pics max
  #     rateLimit: 25 #req/s
  environment:
    # NODE_OPTIONS: '--enable-source-maps' # Pour activer les sourcemaps dans CloudWatch Logs à retirer dans la prod
    RUNTIME: 'lambda'
    USER_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbUserTable}
    AUTH_TABLE: ${cf:site-asso-infra-${sls:stage}.DdbAuthTableName}
    PROJECT_AWS_REGION: ${self:provider.region}

plugins:
