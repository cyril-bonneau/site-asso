service: site-asso-infra
frameworkVersion: '3'

provider:
  name: aws
  region: eu-west-3
  stage: ${opt:stage, 'dev'}

resources:
  Resources:
    AssoMainTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: site-asso-${sls:stage}-asso-main
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: PK,   AttributeType: S }
          - { AttributeName: SK,   AttributeType: S }
          - { AttributeName: GSI1, AttributeType: S }   # email
          - { AttributeName: GSI2, AttributeType: S }   # jti
        KeySchema:
          - { AttributeName: PK, KeyType: HASH }
          - { AttributeName: SK, KeyType: RANGE }
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - { AttributeName: GSI1, KeyType: HASH }
              - { AttributeName: SK,   KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          - IndexName: GSI2
            KeySchema:
              - { AttributeName: GSI2, KeyType: HASH }
              - { AttributeName: SK,   KeyType: RANGE }
            Projection: { ProjectionType: ALL }
        TimeToLiveSpecification:
          AttributeName: TTL
          Enabled: true

  Outputs:
    DdbTableName:
      Value: !Ref AssoMainTable
      Export:
        Name: site-asso-infra-${sls:stage}-DdbTableName
    DdbTableArn:
      Value: !GetAtt AssoMainTable.Arn
      Export:
        Name: site-asso-infra-${sls:stage}-DdbTableArn
