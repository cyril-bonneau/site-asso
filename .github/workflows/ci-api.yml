name: CI/CD site-asso API

on:
  push:
    branches:
      - master
      - dev
      - feature/**
    paths:
      - 'backend/**'
      - 'serverless.api.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'serverless.api.yml'

jobs:
  test:
    name: Lint & tests backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run unit tests
        working-directory: ./backend
        run: npm test

  deploy-dev:
    name: Deploy API (dev)
    needs: test
    # Ne déploie que sur la branche principale, et seulement sur les push (pas PR)
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write      # pour l'OIDC vers AWS
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-3
          role-to-assume: arn:aws:iam::011664843444:role/github_pipeline_access
          role-session-name: site-asso-ci

      - name: Deploy API (dev)
        working-directory: .
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: npx serverless deploy --config serverless.api.yml --stage dev

