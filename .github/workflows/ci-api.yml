name: CI/CD site-asso API

on:
  push:
    branches:
      - master
      - dev
      - pre-prod
      - 'pre-prod/**'
      - 'prod/**'
      - 'feature/**'
      - 'refactor/**'
      - 'fix/**'
      - 'chore/**'
    paths:
      - 'backend/**'
      - 'serverless.api.yml'
      - 'serverless.infra.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'serverless.api.yml'
      - 'serverless.infra.yml'

concurrency:
  group: site-asso-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # Scoped to the flows that have been refactored and characterized — currently
      # register. Suites for flows not yet reworked are excluded on purpose: gating on
      # known-broken tests would just train everyone to ignore a red pipeline.
      # To gate another flow, add its files to `test:unit:ci` in backend/package.json;
      # this workflow does not need to change.
      #
      # Runs to completion. continue-on-error lets the report and the gate below still
      # run, so a failure produces a full picture instead of stopping at the first red file.
      - name: Run unit tests (refactored flows)
        id: unit-tests-run
        working-directory: ./backend
        continue-on-error: true
        run: |
          npm run test:unit:ci -- \
            --reporter=default \
            --reporter=json \
            --outputFile.json=unit-test-results.json

      - name: Unit test report
        if: always()
        working-directory: ./backend
        run: |
          node ../.github/scripts/report-test-results.cjs \
            --title "Unit tests" \
            --results unit-test-results.json

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/unit-test-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check gate - block on unit test failures
        if: always()
        working-directory: ./backend
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const RESULTS_PATH = 'unit-test-results.json';

          if (!fs.existsSync(RESULTS_PATH)) {
            console.log('::error::Unit tests produced no report - vitest crashed before running. Blocking deploy.');
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync(RESULTS_PATH, 'utf8'));

          if (report.numFailedTests > 0) {
            console.log(`::error::${report.numFailedTests} of ${report.numTotalTests} unit tests failed - blocking deploy. See the job summary for the full report.`);
            process.exit(1);
          }

          console.log(`All ${report.numPassedTests} unit tests passed.`);
          NODE

  resolve-stage:
    name: Resolve stage
    runs-on: ubuntu-latest

    outputs:
      stage: ${{ steps.resolve.outputs.stage }}

    steps:
      - name: Resolve STAGE from branch
        id: resolve
        run: |
          set -euo pipefail

          # On pull_request, GITHUB_REF is refs/pull/N/merge, so prefer the head branch.
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Current branch: $BRANCH"

          # Lowercase, collapse every run of non-alphanumerics to a single dash,
          # cap the length, then strip leading/trailing dashes. Keeps the stage usable
          # as a CloudFormation stack name and an SSM parameter path segment.
          slugify() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -cs 'a-z0-9' '-' \
              | cut -c1-30 \
              | sed -e 's/^-*//' -e 's/-*$//'
          }

          SUFFIX=""
          case "$BRANCH" in
            master|prod)  STAGE="prod" ;;
            dev)          STAGE="dev" ;;
            pre-prod)     STAGE="pre-prod" ;;
            pre-prod/*)   SUFFIX="$(slugify "${BRANCH#pre-prod/}")"; STAGE="pre-prod${SUFFIX:+-$SUFFIX}" ;;
            prod/*)       SUFFIX="$(slugify "${BRANCH#prod/}")";     STAGE="prod${SUFFIX:+-$SUFFIX}" ;;
            *)            STAGE="sandbox" ;;
          esac

          echo "Resolved STAGE: $STAGE"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Branch \`$BRANCH\` deploys to stage **\`$STAGE\`**" >> "$GITHUB_STEP_SUMMARY"

  deploy-infra:
    name: Deploy Infra
    needs:
      - resolve-stage
      - unit-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      STAGE: ${{ needs.resolve-stage.outputs.stage }}

    # Serialize on the target stage, not the branch: feature/**, refactor/**, fix/**
    # and chore/** all share the `sandbox` stage, and two simultaneous
    # `serverless deploy --stage sandbox` runs would collide in CloudFormation.
    #
    # The group MUST be unique per job. Two dependency-chained jobs sharing one group
    # deadlock: the downstream job waits on a group its own predecessor occupied.
    concurrency:
      group: site-asso-deploy-infra-${{ needs.resolve-stage.outputs.stage }}
      cancel-in-progress: false

    permissions:
      id-token: write      # pour l'OIDC vers AWS
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Serverless build
        uses: actions/cache@v4
        with:
          path: .serverless
          key: ${{ runner.os }}-serverless-${{ hashFiles('serverless.infra.yml', 'serverless.api.yml') }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-3
          role-to-assume: arn:aws:iam::011664843444:role/github_pipeline_access
          role-session-name: site-asso-ci

      - name: setup refresh secret key
        run: |
          aws ssm put-parameter \
            --name "/site-asso/${STAGE}/secret/refreshTokenHmac" \
            --value "${{ secrets.REFRESH_JWT_SECRET }}" \
            --type SecureString \
            --overwrite

      - name: Debug - config Serverless compilée
        working-directory: .
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: |
          npx serverless print --config serverless.infra.yml --stage $STAGE | sed -n '1,200p'

      - name: Deploy Infra
        working-directory: .
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: |
          npx serverless deploy --config serverless.infra.yml --stage $STAGE

      - name: Sync KMS public key to SSM
        working-directory: ./backend
        env:
          AWS_REGION: eu-west-3
        run: |
          node scripts/syncKmsPublicKeyToSsm.js

  deploy-api:
    name: Deploy API
    needs:
      - resolve-stage
      - deploy-infra
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      STAGE: ${{ needs.resolve-stage.outputs.stage }}

    # Distinct from deploy-infra's group on purpose - see the note there.
    concurrency:
      group: site-asso-deploy-api-${{ needs.resolve-stage.outputs.stage }}
      cancel-in-progress: false

    permissions:
      id-token: write      # pour l'OIDC vers AWS
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Serverless build
        uses: actions/cache@v4
        with:
          path: .serverless
          key: ${{ runner.os }}-serverless-${{ hashFiles('serverless.infra.yml', 'serverless.api.yml') }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-3
          role-to-assume: arn:aws:iam::011664843444:role/github_pipeline_access
          role-session-name: site-asso-ci

      - name: Deploy API
        working-directory: .
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: |
          npx serverless deploy --config serverless.api.yml --stage $STAGE

  integration-tests:
    name: Integration tests
    needs:
      - resolve-stage
      - deploy-api
    runs-on: ubuntu-latest

    env:
      STAGE: ${{ needs.resolve-stage.outputs.stage }}

    permissions:
      id-token: write      # pour l'OIDC vers AWS
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-3
          role-to-assume: arn:aws:iam::011664843444:role/github_pipeline_access
          role-session-name: site-asso-ci

      # Same shape as the unit job: run to completion, report, then gate. Integration
      # failures are worth seeing in full - a partial run tells you which step of the
      # flow broke, which stopping at the first red file would hide.
      - name: Run integration tests
        id: integration-tests-run
        working-directory: ./backend
        continue-on-error: true
        run: |
          npm run test:integration -- \
            --reporter=default \
            --reporter=json \
            --outputFile.json=integration-test-results.json

      - name: Integration test report
        if: always()
        working-directory: ./backend
        run: |
          node ../.github/scripts/report-test-results.cjs \
            --title "Integration tests" \
            --results integration-test-results.json \
            --context "Stage: ${STAGE}"

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/integration-test-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check gate - fail on integration test failures
        if: always()
        working-directory: ./backend
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const RESULTS_PATH = 'integration-test-results.json';

          if (!fs.existsSync(RESULTS_PATH)) {
            console.log('::error::Integration tests produced no report - vitest crashed before running.');
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync(RESULTS_PATH, 'utf8'));

          if (report.numFailedTests > 0) {
            console.log(`::error::${report.numFailedTests} of ${report.numTotalTests} integration tests failed. See the job summary for the full report.`);
            process.exit(1);
          }

          console.log(`Integration tests: ${report.numPassedTests} passed, ${report.numPendingTests || 0} skipped.`);
          NODE
